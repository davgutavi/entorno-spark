# ============================================================
#  Publica la imagen del entorno en GitHub Container Registry
#  (ghcr.io) para linux/amd64 y linux/arm64.
#
#  Se lanza a mano: pestaña Actions → "Publicar imagen" → Run workflow.
#  El nombre y la etiqueta se leen de `image:` en docker-compose.yml,
#  así que solo hay que cambiarlos allí.
#
#  La primera vez, el paquete se crea privado: hazlo público en
#  github.com/<cuenta>?tab=packages → spark-bd → Package settings →
#  Change visibility → Public.
# ============================================================

name: Publicar imagen

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publicar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Leer el nombre de la imagen de docker-compose.yml
        id: imagen
        run: echo "nombre=$(docker compose config --images | grep spark-bd | head -n 1)" >> "$GITHUB_OUTPUT"

      # arm64 se construye con emulación (QEMU) en el runner amd64
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.imagen.outputs.nombre }}
          # Enlaza el paquete con este repositorio
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
