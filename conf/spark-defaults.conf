# Configuración por defecto de las aplicaciones (driver en el contenedor jupyter).
# Una aplicación puede cambiar cualquiera de estos valores con --conf o .config().

# Memoria del driver y de cada executor. Cada worker tiene 2 GB para executors:
# caben dos executors de 1 GB (por ejemplo, el de un notebook y el de un spark-submit).
spark.driver.memory     1g
spark.executor.memory   1g

# spark.sql.shuffle.partitions se deja en su valor por defecto (200).
# Los núcleos por aplicación (2 de 4) los fija el master con spark.deploy.defaultCores.
